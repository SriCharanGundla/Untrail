name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: untrail-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and signing configuration
        id: version
        env:
          VERSION: ${{ inputs.version }}
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(python3 scripts/version.py "$VERSION")
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo '::error::This version already exists.'
            exit 1
          fi
          for tag in $(git tag --list 'v*'); do
            previous=$(python3 scripts/version.py "${tag#v}" 2>/dev/null) || continue
            if (( code <= previous )); then
              echo '::error::Version must be newer than all existing releases.'
              exit 1
            fi
          done
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Configure all four RELEASE_* signing secrets.'
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run regression checks
        run: bash scripts/test.sh

      - name: Decode signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          VERSION: ${{ inputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease "-PreleaseVersion=$VERSION" "-PreleaseCode=$CODE"

      - name: Verify and prepare APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          apk="release/Untrail-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1p'
          (cd release && sha256sum "Untrail-v$VERSION.apk" > SHA256SUMS.txt)

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" "release/Untrail-v$VERSION.apk" release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Untrail v$VERSION" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
