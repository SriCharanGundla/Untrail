plugins { id 'com.android.application' }

def releaseVersion = providers.gradleProperty('releaseVersion').getOrElse('0.1.0')
def releaseCode = providers.gradleProperty('releaseCode').getOrElse('1000').toInteger()
def keyPath = System.getenv('RELEASE_KEYSTORE_PATH')
android {
 namespace 'app.untrail'
 compileSdk 36
 defaultConfig {
  applicationId 'app.untrail'
  minSdk 31
  targetSdk 36
  versionCode releaseCode
  versionName releaseVersion
 }
 signingConfigs {
  release {
   if (keyPath) {
    storeFile file(keyPath)
    storePassword System.getenv('RELEASE_STORE_PASSWORD')
    keyAlias System.getenv('RELEASE_KEY_ALIAS')
    keyPassword System.getenv('RELEASE_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release { if (keyPath) signingConfig signingConfigs.release }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
